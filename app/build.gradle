plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aismarttube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aismarttube.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // fixed signing key so the Google sign-in SHA-1 never changes between GitHub builds.
    // The key is stored as plain text (debug-keystore.txt) and turned back into a keystore file at build time.
    def ksFile = new File(buildDir, 'fixed-debug.keystore')
    if (!ksFile.exists()) {
        ksFile.parentFile.mkdirs()
        ksFile.bytes = file('debug-keystore.txt').text.replaceAll('\\s', '').decodeBase64()
    }
    signingConfigs {
        debug {
            storeFile ksFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'de.sciss:jump3r:1.0.5'

    // Google Sign-In + OAuth token (YouTube Data API)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
